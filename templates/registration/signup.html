{% extends '../layouts/base.html' %}


{% block content %}
    <h1>Registration</h1>
    <form method="post" enctype="multipart/form-data"> 
        {% csrf_token %}
        <div class="card w-50">
            <div class="row">
                <div class="col-md-12 p-5">
                    {{ form.as_p }} 
                    {{ profile_form.as_p }} 
                    <button type="submit">Registrarse</button> 
                </div>
            </div>
        </div>
        
    </form>
{% endblock content %}
