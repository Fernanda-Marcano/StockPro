{% extends '../layouts/base.html' %}


{% block content %}
    <h1>Login</h1>
    <form action="" method="post">
        {% csrf_token %}
        <div class="card w-50 p-5">
            {% for log in form %}
                {{ log.label_tag }}
                {{ log }}
            {% endfor %}
            <button type="submit">Login</button>
        </div>
    </form>
{% endblock content %}
